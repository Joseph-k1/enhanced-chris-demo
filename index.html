<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Venue name matches VENUE in app/src/store.tsx -->
<title>KneesUp Tavern · KneesUp booking demo</title>
<style>
  :root { --green:#2a392c; --ink:#16241c; --muted:#66756c; --line:#e3e8e4; }
  * { box-sizing:border-box }
  html, body { margin:0; height:100% }
  body { display:flex; height:100vh; flex-direction:column; background:#f3f6f4; color:var(--ink); font:14px/1.45 "Segoe UI", system-ui, sans-serif }
  header { display:flex; align-items:center; gap:14px; background:var(--green); color:#fff; padding:10px 16px }
  header b { font-size:15px }
  header .step { color:#c9d4cb; font-size:12px }
  header .spacer { flex:1 }
  button { font:inherit; cursor:pointer }
  button.ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:8px; padding:6px 12px }
  #wrap { display:flex; min-height:0; flex:1 }
  nav { width:260px; overflow:auto; border-right:1px solid var(--line); background:#fff; padding:8px }
  nav button { display:block; width:100%; border:0; border-radius:10px; background:transparent; padding:9px 10px; text-align:left; color:#3c4c43 }
  nav button.on { background:#e7f0ea; color:#1c3828; font-weight:700 }
  nav small { display:block; margin-top:2px; color:#7d8b82; font-size:11px; font-weight:500 }
  #stage { position:relative; min-width:0; flex:1 }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff }
  footer { display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); background:#fff; padding:10px 16px }
  footer p { flex:1; margin:0 }
  footer .navbtn { border:1px solid #d5ddd6; border-radius:8px; background:#fff; padding:8px 14px; font-weight:700 }
  footer .navbtn.primary { border-color:var(--green); background:var(--green); color:#fff }
  @media (max-width: 860px) { nav { display:none } }
</style>
</head>
<body>
<header>
  <b>KneesUp Tavern</b>
  <span class="step">KneesUp booking demo · step <span id="num">1</span> of <span id="total"></span></span>
  <div class="spacer"></div>
  <button class="ghost" id="reset">Start over</button>
</header>
<div id="wrap">
  <nav id="steps"></nav>
  <div id="stage"><iframe id="app" src="app.html?v=5" title="KneesUp Tavern booking demo"></iframe></div>
</div>
<footer>
  <button class="navbtn" id="prev">Back</button>
  <p id="cap"></p>
  <button class="navbtn primary" id="next">Next</button>
</footer>
<script>
/* The presenter shell. The app in the iframe keeps every booking in localStorage, so the
 * calendar, the guest portal and these emails all show the same reservation. */
const SLIDES = [
  { id: "venue", name: "KneesUp Tavern microsite", cap: "Allison opens KneesUp Tavern venue page: photos, spaces, Book Space or Book Full Venue.", app: { mode: "book", page: "venue" } },
  { id: "book", name: "Pick a space and date", cap: "She chooses a space, Saturday October 10, and a time on the calendar.", app: { mode: "book", page: "wizard" } },
  { id: "checkout", name: "Reservation details", cap: "Her name, guests and event. Reserve Now sends the request. Nothing is paid yet.", app: { mode: "book", page: "details" } },
  { id: "sent", name: "Inquiry submitted", cap: "The request is with KneesUp Tavern. It is not approved, and nothing has been paid.", app: { mode: "book", page: "sent" } },
  { id: "mailHost", name: "KneesUp Tavern gets the email", cap: "Jack's events inbox. The button opens Allison's inquiry so he can quote it.", app: { mode: "mail", page: "hostNew", ensure: "inquiry" } },
  { id: "review", name: "Jack approves the quote", cap: "He sets the price. Deposit starts at 50%. Approve emails Allison. She cannot pay before this.", app: { mode: "host", page: "Reservations", select: true, ensure: "inquiry" } },
  { id: "mailGuest", name: "Allison's approval email", cap: "Your request is approved. Pay the deposit. That button opens her event portal.", app: { mode: "mail", page: "deposit", ensure: "approved" } },
  { id: "pay", name: "Her event portal", cap: "Pay opens Allison's guest portal. Status shows approved, deposit due. She pays it here.", app: { mode: "guest", page: "Payments", ensure: "approved" } },
  { id: "confirmed", name: "Reservation confirmed", cap: "After the deposit, the portal shows confirmed and the host workspace has the paid booking.", app: { mode: "guest", page: "My event", ensure: "confirmed" } },
  { id: "hostbook", name: "It shows in the host portal", cap: "Jack sees Allison's confirmed reservation, the deposit paid, and the balance still due.", app: { mode: "host", page: "Reservations", select: true, ensure: "confirmed" } },
  { id: "calendar", name: "It lands on the calendar", cap: "Confirmed bookings hold the space. A new inquiry shows dashed, and doesn't block the date.", app: { mode: "host", page: "Calendar", ensure: "confirmed" } },
  { id: "messages", name: "One shared conversation", cap: "A message Allison sends is waiting for Jack, and the reply shows up in her portal.", app: { mode: "host", page: "Messages", ensure: "confirmed" } },
];
const app = document.getElementById("app");
let i = Math.max(0, SLIDES.findIndex((s) => s.id === location.hash.slice(1)));
let ready = false;
const send = () => { if (ready) app.contentWindow.postMessage({ k: "nav", ...SLIDES[i].app }, "*"); };
const paint = () => {
  document.getElementById("num").textContent = i + 1;
  document.getElementById("total").textContent = SLIDES.length;
  document.getElementById("cap").textContent = SLIDES[i].cap;
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").textContent = i === SLIDES.length - 1 ? "Done" : "Next";
  document.getElementById("steps").innerHTML = SLIDES.map((s, n) => `<button data-n="${n}" class="${n === i ? "on" : ""}">${n + 1}. ${s.name}<small>${s.cap}</small></button>`).join("");
  location.hash = SLIDES[i].id;
};
const go = (n) => { i = Math.min(SLIDES.length - 1, Math.max(0, n)); paint(); send(); };
addEventListener("message", (e) => {
  if (e.source !== app.contentWindow) return;
  if (e.data?.k === "ready") { ready = true; send(); }
  if (e.data?.k === "goto") { const n = SLIDES.findIndex((s) => s.id === e.data.slide); if (n >= 0) go(n); }
});
addEventListener("hashchange", () => { const n = SLIDES.findIndex((s) => s.id === location.hash.slice(1)); if (n >= 0 && n !== i) go(n); });
document.getElementById("steps").onclick = (e) => { const b = e.target.closest("button"); if (b) go(+b.dataset.n); };
document.getElementById("prev").onclick = () => go(i - 1);
document.getElementById("next").onclick = () => go(i + 1);
document.getElementById("reset").onclick = () => { app.contentWindow.postMessage({ k: "reset" }, "*"); setTimeout(() => go(0), 40); };
paint();
</script>
</body>
</html>
