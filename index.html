<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanterns: booking journey</title>
<style>
  :root {
    --navy: #0f2c4c; --navy-d: #0a2038; --ink: #0f1f2e; --muted: #6b7280; --faint: #9ca3af;
    --line: #e2e8f0; --field: #f7f9fc; --teal: #1d8fa5; --tealbg: #e6f4f7; --bg: #f3f6fb; --green: #10b981;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  body.dark { background: #0b1b30; }
  #stage { flex: 1; min-height: 0; overflow: auto; position: relative; }
  #stage.center { display: flex; overflow: auto; background: #0b1b30; cursor: pointer; }
  #stage.hostfill { overflow: hidden; }
  #hostframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f3f6fa; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { display: block; }

  .top { background: #fff; border-bottom: 1px solid var(--line); }
  .top-in { max-width: 914px; margin: 0 auto; height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 12px; }
  .back { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; font-size: 12px; color: #374151; }
  .back i { width: 22px; height: 22px; border-radius: 50%; background: #f3f4f6; display: inline-flex; align-items: center; justify-content: center; }
  .brandmini { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
  .foot { margin-top: 28px; background: #fff; border-top: 1px solid var(--line); height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .foot b { color: var(--navy); font-size: 14px; letter-spacing: -.02em; }

  .banner { height: 250px; overflow: hidden; background: #0f2540; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 22px 20px 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 14px; }
  h1.vn { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2; }
  .addr { margin: 6px 0 0; color: var(--teal); font-size: 15px; font-weight: 500; }
  .pbtn { height: 37px; padding: 0 18px; border: 0; border-radius: 24px; background: var(--navy); color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 4px; transition: background .2s, transform .2s; }
  .pbtn:hover { background: var(--navy-d); transform: translateY(-1px); }
  .pbtn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .obtn { height: 37px; padding: 0 20px; border: 1px solid #d1d5db; border-radius: 24px; background: #fff; color: #374151; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; }
  .obtn:hover { background: var(--field); }
  .tbtn { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 500; }
  .tbtn:hover { color: var(--ink); }
  .para { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .stats { display: flex; gap: 40px; padding: 4px 0 18px; }
  .stats span { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .stats strong { display: block; margin-top: 4px; font-size: 16px; font-weight: 600; }
  .hr { height: 1px; background: var(--line); }
  .row { display: flex; align-items: center; gap: 8px; padding: 14px 0; font-size: 13px; color: var(--muted); }
  .row b { color: var(--teal); font-weight: 600; }
  .row .sp { margin-left: auto; }
  .contact { padding: 14px 0; font-size: 13px; color: var(--muted); line-height: 1.9; }
  .contact b { color: var(--teal); font-weight: 600; }
  .socials { display: flex; gap: 14px; padding: 14px 0 18px; color: #4b5563; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-top: 6px; overflow-x: auto; }
  .tabs span { padding: 12px 14px; font-size: 13px; color: #4b5563; white-space: nowrap; border-bottom: 2px solid transparent; }
  .tabs span.on { color: var(--teal); font-weight: 600; border-color: var(--teal); }
  .spaces { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
  .space { display: flex; gap: 20px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 24px; }
  .space .img { width: 250px; height: 176px; flex: none; border-radius: 16px; overflow: hidden; background: #0f2540; }
  .space .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
  .space h3 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .space p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .pillrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: #f3f4f6; color: var(--muted); font-size: 12px; font-weight: 500; }
  .space .bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 4px; }
  .mini { display: flex; gap: 30px; }
  .mini span { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
  .mini b { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; }

  .bk { max-width: 914px; margin: 0 auto; padding: 24px 20px 0; }
  .bk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
  .bk-head h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .bk-head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  .rail { display: flex; gap: 6px; }
  .rail i { width: 22px; height: 22px; border-radius: 50%; background: #e5e7eb; color: var(--muted); font-style: normal; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .rail i.on { background: var(--navy); color: #fff; }
  .sheet { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 26px; }
  .sec h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.2; }
  .sec .s { margin: 5px 0 12px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .sec h2 em { color: var(--muted); font-weight: 400; font-style: normal; }
  .pick { display: flex; gap: 12px; overflow-x: auto; padding: 2px; }
  .pc { flex: 0 0 200px; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .pc .im { height: 92px; overflow: hidden; background: #0f2540; }
  .pc .nm { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
  .pc .nm span { font-size: 11px; font-weight: 600; color: var(--muted); background: #f3f4f6; border-radius: 99px; padding: 3px 9px; }
  .pc.on { border-color: var(--navy); box-shadow: 0 0 0 2px var(--navy); }
  .pc.on .nm span { background: var(--navy); color: #fff; }
  .dt { display: flex; gap: 14px; align-items: stretch; }
  .cal { flex: 1.3; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .cal .m { display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .grid7 span { text-align: center; font-size: 11px; color: var(--faint); padding: 5px 0; font-weight: 500; }
  .grid7 button { height: 34px; border: 0; border-radius: 8px; background: none; font-size: 13px; }
  .grid7 button:disabled { color: #d1d5db; cursor: default; }
  .grid7 button:hover:not(:disabled):not(.on) { background: #f3f4f6; }
  .grid7 button.on { background: var(--navy); color: #fff; font-weight: 600; }
  .tp { flex: 1; display: flex; gap: 10px; min-width: 0; }
  .tcol { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; max-height: 322px; overflow-y: auto; }
  .tcol h4 { margin: 0 0 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tcol button { height: 32px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 12px; }
  .tcol button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tcol button:hover:not(.on) { background: #f3f4f6; }
  .sum { border: 1px solid var(--line); border-radius: 12px; }
  .sum .r { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; font-size: 13px; }
  .sum .r span { color: var(--muted); }
  .sum .r b { font-weight: 600; }
  .note { padding: 10px 12px; border-radius: 8px; background: var(--tealbg); color: var(--teal); font-size: 12px; }
  .bar2 { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
  .warn { margin-right: auto; color: #ef4444; font-size: 12px; font-weight: 500; }

  .cf h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; }
  .cf .s2 { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .f { display: flex; flex-direction: column; gap: 8px; }
  .f.wide { grid-column: 1 / -1; }
  .f label { font-size: 13px; font-weight: 500; line-height: 1; }
  .f input, .f textarea { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 0 12px; font-size: 13px; outline: none; }
  .f input { height: 44px; }
  .f textarea { min-height: 104px; padding: 12px; line-height: 1.5; resize: vertical; }
  .f input:focus, .f textarea:focus, .ph:focus-within { border-color: var(--teal); }
  .ph { display: flex; height: 44px; border: 1px solid var(--line); background: var(--field); border-radius: 8px; overflow: hidden; }
  .ph u { flex: none; text-decoration: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; font-size: 13px; }
  .ph input { border: 0; height: 42px; background: none; }
  .pd { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .pd .t { padding: 16px 16px 14px; }
  .pd .t h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1; }
  .pd .t p { margin: 6px 0 0; color: var(--faint); font-size: 12px; line-height: 1; }
  .pr { display: flex; justify-content: space-between; gap: 16px; padding: 14px 16px; font-size: 13px; font-weight: 600; }
  .pr.sub { padding: 10px 16px 10px 32px; color: var(--muted); font-weight: 400; }
  .pd .opt { padding: 8px 16px 12px; }
  .pd .opt .k { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
  .pd .opt .d { margin: 2px 0 10px; font-size: 12px; line-height: 1.4; color: var(--muted); }
  .ofee { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px dashed #d1d5db; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .ofee.on { border: 1px solid var(--navy); background: rgba(15, 44, 76, .05); }
  .ofee .l { display: flex; align-items: center; gap: 10px; }
  .ofee .r { display: flex; align-items: center; gap: 8px; }
  .ofee .r em { font-style: normal; font-size: 11px; font-weight: 500; color: var(--faint); }
  .ofee .r b { font-weight: 600; color: var(--muted); }
  .ofee.on .r b { color: var(--ink); }
  .ofee input { width: 16px; height: 16px; accent-color: var(--navy); margin: 0; }

  .okwrap { max-width: 914px; margin: 0 auto; padding: 32px 20px 0; }
  .ok { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 64px 24px 30px; text-align: center; }
  .ok .in { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
  .halo { width: 96px; height: 96px; border-radius: 50%; background: rgba(16, 185, 129, .1); display: flex; align-items: center; justify-content: center; }
  .halo i { width: 56px; height: 56px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; }
  .ok h1 { margin: 32px 0 0; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .ok p { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .ok p b { color: var(--ink); }
  .ok .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  .ok .btns .pbtn, .ok .btns .obtn { height: 38px; }
  .ok .tealnote { margin: 48px auto 0; width: fit-content; max-width: 100%; padding: 12px 16px; border-radius: 8px; background: var(--tealbg); color: var(--teal); font-size: 12px; line-height: 1.5; }
  .ok .tealnote a { color: inherit; text-decoration: underline; }

  .shot { position: relative; line-height: 0; margin: auto; flex: none; }
  .shot img { display: block; width: auto; height: auto; max-width: 100%; }
  .hot { position: absolute; border-radius: 6px; cursor: pointer; }
  .hot:hover { outline: 2px solid #22b8cf; background: rgba(34, 184, 207, .12); }

  #bar { flex: none; display: flex; flex-direction: column; background: #0b1b30; color: #d5e0ea; font-size: 13px; }
  #stripwrap { position: relative; }
  #strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 36px 6px; scrollbar-width: none; }
  #strip::-webkit-scrollbar { display: none; }
  #strip button { flex: none; height: 28px; padding: 0 12px; border-radius: 99px; border: 1px solid #2c4262; background: transparent; color: #d5e0ea; font-size: 12px; font-weight: 600; white-space: nowrap; }
  #strip button.on { background: #22b8cf; border-color: #22b8cf; color: #06202a; }
  #stripwrap:before, #stripwrap:after { content: ""; position: absolute; top: 0; bottom: 0; width: 36px; pointer-events: none; }
  #stripwrap:before { left: 0; background: linear-gradient(90deg, #0b1b30, transparent); }
  #stripwrap:after { right: 0; background: linear-gradient(270deg, #0b1b30, transparent); }
  #more { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #9fd7e2; pointer-events: none; background: #0b1b30; padding-left: 8px; }
  #more.hide { display: none; }
  #bar2 { display: flex; align-items: center; gap: 12px; padding: 2px 14px 8px; }
  #cap { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zoom { display: flex; align-items: center; gap: 2px; flex: none; }
  .zoom button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #2c4262; background: #12263f; color: #fff; font-size: 16px; line-height: 1; }
  .zoom button:hover { background: #1c3858; }
  #zl { width: 42px; text-align: center; font-size: 12px; color: #9fb0c4; }
  .nb { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid #2c4262; background: #12263f; color: #fff; display: flex; align-items: center; justify-content: center; }
  .nb:hover:not(:disabled) { background: #1c3858; }
  .nb:disabled { opacity: .3; cursor: default; }
  .nb.next { background: #22b8cf; border-color: #22b8cf; color: #06202a; }
  #hint { flex: none; opacity: .55; font-size: 12px; }

  @media (max-width: 760px) {
    .space { flex-direction: column; }
    .space .img { width: 100%; }
    .dt, .cf-grid, .head { display: block; }
    .cf-grid .f { margin-bottom: 14px; }
    .tp { margin-top: 14px; }
    .head .pbtn { margin-top: 12px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffd48a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3a5c"/><stop offset=".62" stop-color="#7488a6"/><stop offset="1" stop-color="#f2b27a"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18354f"/><stop offset="1" stop-color="#0e2339"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2b20"/><stop offset="1" stop-color="#221812"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1d33"/><stop offset="1" stop-color="#27486c"/></linearGradient>
  <linearGradient id="plum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f4d"/><stop offset="1" stop-color="#171b30"/></linearGradient>
</defs></svg>
<div id="stage"></div>
<div id="bar"><div id="stripwrap"><div id="strip"></div><span id="more">scroll for more slides →</span></div><div id="bar2"><span id="cap"></span><div class="zoom"><button id="zout" aria-label="Zoom out">−</button><span id="zl">100%</span><button id="zin" aria-label="Zoom in">+</button></div><button class="nb" id="prev" aria-label="Previous"></button><button class="nb next" id="next" aria-label="Next"></button><span id="hint"></span></div></div>

    '<div class="sec"><h2>Select venue</h2><p class="s">Select a venue to book it in full, or pick a venue first then choose one space</p><div class="pick"><button class="pc on" style="flex-basis:260px" data-pick=""><div class="im">' + sceneMain(true) + '</div><div class="nm">' + VENUE.name + '<span>Selected</span></div></button></div></div><div class="hr"></div>' +
    '<div class="sec"><h2>Select space <em>(optional)</em></h2><p class="s">' + (state.space ? 'Booking a single space at <b>' + VENUE.name + '</b>. Click the selected space again to switch back to full venue.' : '<b>' + VENUE.name + '</b> is booked as a full venue. Choose a space below only if you want a single area instead.') + '</p><div class="pick">' + pickers + '</div></div><div class="hr"></div>' +
    '<div class="sec"><h2>Select date &amp; time</h2><p class="s">Choose date, time, &amp; duration of your reservation.</p><div class="dt"><div class="cal"><div class="m">October 2026</div><div class="grid7">' + ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map(function (x) { return "<span>" + x + "</span>"; }).join("") + days.join("") + '</div></div><div class="tp">' + col("start", "Start time") + col("end", "End time") + '</div></div></div><div class="hr"></div>' +
    '<div class="sec"><h2>Reservation summary</h2><p class="s">Confirm your date, time, &amp; duration of your reservation.</p><div class="sum"><div class="r"><span>Date</span><b>' + when() + '</b></div><div class="hr"></div><div class="r"><span>Time</span><b>' + SLOTS[state.start] + ' - ' + SLOTS[state.end] + '</b></div><div class="hr"></div><div class="r"><span>Total duration</span><b>' + (okTime ? hours() + " hours" : "0 hours") + '</b></div></div></div>' +
    '<div class="bar2">' + (okTime ? "" : '<span class="warn">Choose an end time after the start time.</span>') + '<button class="tbtn" data-go="venue">Cancel</button><button class="pbtn" id="cont"' + (okTime ? "" : " disabled") + '>Continue reservation</button></div></div></div>' + FOOT;
  bind();
  stage.querySelectorAll("[data-pick]").forEach(function (b) { b.onclick = function () { var id = b.dataset.pick; if (id) state.space = state.space === id ? null : id; show(); }; });
  stage.querySelectorAll("[data-day]").forEach(function (b) { b.onclick = function () { state.day = +b.dataset.day; show(); }; });
  stage.querySelectorAll("[data-start]").forEach(function (b) { b.onclick = function () { state.start = +b.dataset.start; show(); }; });
  stage.querySelectorAll("[data-end]").forEach(function (b) { b.onclick = function () { state.end = +b.dataset.end; show(); }; });
  document.getElementById("cont").onclick = function () { if (hours() > 0) goId("checkout"); };
}

function renderCheckout() {
  var q = quote();
  var fees = q.r.fees.map(function (f) { return '<div class="pr sub"><span>' + f[0] + '</span><span>' + money2(f[1]) + '</span></div>'; }).join("");
  stage.innerHTML = topbar(BACK("book", "Back")) + '<div class="bk"><div class="bk-head"><div><h1>Make a reservation</h1><p>Book the full venue or a single space for your event.</p></div><div class="rail"><i>1</i><i class="on">2</i></div></div><div class="sheet cf">' +
    '<div><h2>Confirm reservation details</h2><p class="s2">Review your reservation details before payment.</p></div>' +
    '<div class="cf-grid"><div class="f"><label for="name">Full Name</label><input id="name" value="' + esc(state.name) + '" placeholder="Enter your full name"></div><div class="f"><label for="email">Your email address</label><input id="email" type="email" value="' + esc(state.email) + '" placeholder="Enter your email"></div>' +
    '<div class="f"><label for="phone">Phone Number</label><div class="ph"><u>US ' + ic("down", 12) + '</u><input id="phone" value="' + esc(state.phone) + '" placeholder="Enter your phone number"></div></div><div class="f"><label for="guests">How many guest?</label><input id="guests" value="' + esc(state.guests) + '" placeholder="Enter number of people"></div>' +
    '<div class="f wide"><label for="note">Describe your event</label><textarea id="note" placeholder="Please provide details about your event or any additional information">' + esc(state.note) + '</textarea></div></div>' +
    '<div class="pd"><div class="t"><h3>Payment Details</h3><p>Estimated minimum price and deposit</p></div><div class="hr"></div>' +
    '<div class="pr"><span>Booking Prepayment (50% – Paying now)</span><span>' + money2(q.deposit) + '</span></div><div class="hr"></div>' +
    '<div class="pr"><span>After Payment (Payment on site)</span><span>' + money2(q.after) + '</span></div><div style="padding-bottom:6px"><div class="pr sub"><span>Remaining for booking</span><span>' + money2(q.remaining) + '</span></div>' + fees + '</div>' +
    '<div class="opt"><p class="k">Optional Add-ons</p><p class="d">Check the box for any extras you\'d like. Unchecked items won\'t be added to your total.</p><label class="ofee' + (state.cake ? " on" : "") + '"><span class="l"><input id="cake" type="checkbox"' + (state.cake ? " checked" : "") + '>Birthday cake</span><span class="r">' + (state.cake ? "" : "<em>Check to add</em>") + '<b>' + money2(120) + '</b></span></label></div>' +
    '<div class="hr"></div><div class="pr"><span>Estimated Minimum Price</span><span>' + money2(q.total) + '</span></div></div>' +
    '<div class="bar2"><button class="obtn" data-go="venue">Cancel</button><button class="pbtn" id="reserve">Reserve Now</button></div></div></div>' + FOOT;
  bind();
  ["name", "email", "phone", "guests", "note"].forEach(function (id) { document.getElementById(id).oninput = function (e) { state[id] = e.target.value; }; });
  document.getElementById("cake").onchange = function (e) { state.cake = e.target.checked; show(); };
  document.getElementById("reserve").onclick = function () { readFields(); if (state.name.trim() && state.email.trim()) goId("paid"); };
}
function readFields() { ["name", "email", "phone", "guests", "note"].forEach(function (id) { var el = document.getElementById(id); if (el) state[id] = el.value; }); }

function renderPaid() {
  stage.innerHTML = topbar(BACK("venue", "Back to Home")) + '<div class="okwrap"><div class="ok"><div class="in"><div class="halo"><i>' + ic("check", 28, 3) + '</i></div><h1>Payment Successful</h1><p>Your reservation with <b>' + VENUE.name + '</b> has been confirmed. Check your email or SMS for your secure magic link to access your guest portal.</p><div class="btns"><button class="pbtn" data-go="host">Open host workspace</button><button class="obtn" data-go="venue">Browse More Venue</button></div></div><div class="tealnote"><b>Note:</b> Have more questions? Contact support at <a href="#" onclick="return false">support@kneesupvenues.com</a>.</div></div></div>' + FOOT;
  bind();
}

/* ---------- Chris's screens ---------- */
function renderHost() {
  stage.innerHTML = '<iframe id="hostframe" title="Lanterns host workspace"></iframe>';
  stage.querySelector("#hostframe").srcdoc = HOST_HTML;
}

const SLIDES = [
  { id: "venue", cap: "Avery opens the Lanterns microsite to book a birthday dinner.", render: renderVenue },
  { id: "book", cap: "She picks Main Dining, Saturday October 10, 6:00 to 10:00 PM, then continues.", render: renderBook },
  { id: "checkout", cap: "Checkout: her details, the deposit due now, and an optional birthday cake.", render: renderCheckout },
  { id: "paid", cap: "Avery pays the deposit. The reservation is confirmed. Open the host workspace next.", render: renderPaid },
  { id: "host", cap: "Sally's Lanterns workspace. Open Avery Johnson, then try Calendar, Contracts, Guest list, and Settings.", render: renderHost },
  { id: "guest", cap: "Avery's guest portal: the birthday, in one place.", img: "guest" }
];

const NAMES = ["Venue", "Book", "Checkout", "Paid", "Host workspace", "Guest portal"];
const strip = document.getElementById("strip"), more = document.getElementById("more"), cap = document.getElementById("cap"), hint = document.getElementById("hint"), prev = document.getElementById("prev"), next = document.getElementById("next"), zl = document.getElementById("zl");
prev.innerHTML = ic("left", 16); next.innerHTML = ic("right", 16);
let i = Math.max(0, Math.min(SLIDES.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
let zoom = 1;
SLIDES.forEach(function (s, n) { var b = document.createElement("button"); b.textContent = (n + 1) + "  " + NAMES[n]; b.title = s.cap; b.onclick = function () { go(n); }; strip.appendChild(b); });
strip.addEventListener("scroll", function () { more.classList.toggle("hide", strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 12); });
prev.onclick = function () { go(i - 1); };
next.onclick = function () { go(i + 1); };

function setZoom(z) { zoom = Math.min(2.5, Math.max(0.5, Math.round(z * 10) / 10)); zl.textContent = Math.round(zoom * 100) + "%"; fit(); }
document.getElementById("zin").onclick = function () { setZoom(zoom + 0.1); };
document.getElementById("zout").onclick = function () { setZoom(zoom - 0.1); };
function fit() {
  var img = stage.querySelector(".shot img"), shot = stage.querySelector(".shot");
  if (img) {
    stage.style.zoom = "";
    img.style.maxWidth = Math.floor(stage.clientWidth * zoom) + "px";
    img.style.maxHeight = Math.floor(stage.clientHeight * zoom) + "px";
    if (shot) shot.style.margin = zoom > 1 ? "0" : "auto";
  } else stage.style.zoom = String(zoom);
}
addEventListener('resize', fit);
function goId(id) { var n = SLIDES.findIndex(function (s) { return s.id === id; }); if (n >= 0) go(n); }
function bind() {
  stage.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { goId(b.dataset.go); }; });
  stage.querySelectorAll("[data-space]").forEach(function (b) { b.onclick = function () { state.space = b.dataset.space === "all" ? null : b.dataset.space; goId("book"); }; });
}
function show() {
  var s = SLIDES[i], top = stage.scrollTop;
  document.body.classList.toggle("dark", !!s.img);
  stage.classList.toggle("center", !!s.img);
  stage.classList.toggle("hostfill", s.id === "host");
  stage.onclick = null;
  stage.innerHTML = "";
  if (s.render) { s.render(); stage.scrollTop = top; }
  else {
    var w = document.createElement("div"); w.className = "shot";
    var img = new Image(); img.src = IMG[s.img]; img.alt = s.cap; img.draggable = false; w.appendChild(img);
    (s.hot || []).forEach(function (h) {
      var a = document.createElement("div"); a.className = "hot";
      Object.assign(a.style, { left: h.x + "%", top: h.y + "%", width: h.w + "%", height: h.h + "%" });
      a.onclick = function (e) { e.stopPropagation(); goId(h.to); };
      w.appendChild(a);
    });
    stage.appendChild(w);
    fit();
    stage.onclick = function () { go(i + 1); };
  }
  [].forEach.call(strip.children, function (d, n) { d.classList.toggle("on", n === i); });
  strip.children[i].scrollIntoView({ inline: "center", block: "nearest" });
  cap.textContent = (i + 1) + " / " + SLIDES.length + "   " + s.cap;
  prev.disabled = i === 0; next.disabled = i === SLIDES.length - 1;
  hint.textContent = s.img ? "Click anywhere to continue" : "";
  more.classList.toggle("hide", strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 12);
  history.replaceState(null, "", "#" + (i + 1));
}
function go(n) { if (n < 0 || n >= SLIDES.length) return; if (SLIDES[i].id === "checkout") readFields(); if (n !== i) stage.scrollTop = 0; i = n; show(); }
addEventListener("keydown", function (e) {
  var t = document.activeElement && document.activeElement.tagName;
  if (t === "INPUT" || t === "TEXTAREA") return;
  if (["ArrowRight", "PageDown"].indexOf(e.key) > -1) { e.preventDefault(); go(i + 1); }
  else if (["ArrowLeft", "PageUp"].indexOf(e.key) > -1) { e.preventDefault(); go(i - 1); }
  else if (e.key === "+" || e.key === "=") { e.preventDefault(); setZoom(zoom + 0.1); }
  else if (e.key === "-" || e.key === "_") { e.preventDefault(); setZoom(zoom - 0.1); }
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
stage.addEventListener("wheel", function (e) { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); setZoom(zoom + (e.deltaY < 0 ? 0.1 : -0.1)); }, { passive: false });
addEventListener("hashchange", function () { go((parseInt(location.hash.slice(1), 10) || 1) - 1); });
show();
</script>
</body>
</html>
